name: "The Channel - Northern Phalanx"
theater: "The Channel"
authors: "Ghost"
recommended_player_faction: "Finland 1975 (DK stand-ins)"
recommended_enemy_faction: "Turkey 1975"
recommended_start_date: 1974-08-01
description: "<p>Finland has provided armed assistance to the Cypriot/Greek forces resisting the illegal invasion of Cyprus. In retaliation, Turkey has sent an expeditionary marine force to launch a landfall into mainland Europe. After initial Turkish success, Finnish Defence Forces are preparing to push the Turks into the sea.</p>"
miz: "channel_northern_phalanx.miz"
performance: 2
version: "10.4"
settings:
  pretense_extra_zone_connections: 0
  pretense_disable_ground_assaults: true
  pretense_disable_supply_convoys: true
  pretense_ground_assaults_prefer_roads: false
  pretense_num_of_cargo_planes: 1
  pretense_do_not_generate_sead_missions: true
  pretense_do_not_generate_csar_missions: true
  pretense_controllable_carrier: false
  pretense_cap_mission_dist_to_front: 4
  pretense_sead_mission_dist_to_front: 4
  pretense_strike_mission_dist_to_front: 4
  pretense_ai_max_mission_dist_to_front: 12
  perf_culling: false
  perf_culling_distance: 110
  player_skill: "High"
  enemy_skill: "Average"
  enemy_vehicle_skill: "Average"
  night_day_missions: NightMissions.OnlyDay
  labels: "Dot Only"
  default_start_type_client: StartType.WARM

  ground_start_ai_planes: true
  ground_start_scenery_remove_triggers: false
  ground_start_ground_power_trucks: false
  ground_start_ground_power_trucks_roadbase: false

  plugins:
    gamemaster: true
    skynetiads: false
    ewrs: true
    splashdamageclusters: true
    splashdamageclusters.bdaMessages: true
    splashdamageclusters.clusterEffects: true
    splashdamageclusters.shipRadarDamage: true
 #Mods to be used
  a4_skyhawk: true
  coldwarassets: true
  # f84g_thunderjet: true
  # f100_supersabre: true
  # f104_starfighter: true
  swedishmilitaryassetspack: true
  uh_60l: true

