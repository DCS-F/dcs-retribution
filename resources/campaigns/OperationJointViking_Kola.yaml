description:
  <p><strong>Situation:</strong></p>
  <p>A peer adversary has launched a limited war against NATO. Using civilian transport vessels as cover, OPFOR forces conducted a surprise landing at Evenes Airfield and successfully captured it. 
  Simultaneously, coordinated cruise‑missile strikes rendered Bardufoss and Andøya temporarily inoperable.</p>
  <p>With Evenes secured, OPFOR began rapid airlifts to reinforce their foothold, enabling them to seize Bjerkvik. Their ground forces are now advancing toward Bardufoss Airfield. Meanwhile, OPFOR’s Northern Fleet has deployed to block NATO naval intervention along the Norwegian coast.</p>
  <p>At the same time, OPFOR has opened a second front by launching a ground offensive in the northern Kola Peninsula.</p>
  
  <p><strong>NATO Commander:</strong></p>
  <p>You command the Southern Norwegian forces. Your mission is to halt the OPFOR advance toward Bardufoss Airfield, retake Evenes, and neutralize the enemy carrier group. You win the campaign if you recapture Evenes, and sink the enemy carrier.
  You lose if OPFOR captures Bardufoss Airfield or sinks your carrier.</p>
  <p>Your starting force represents the surviving elements of the Royal Norwegian Air Force and the task force assigned to your sector, while the bulk of NATO forces are committed to the northern front.</p>
  <p></p>
  <p><strong>OPFOR Commander:</strong></p>
  <p>You command the invasion forces operating from the Evenes bridgehead. Your mission is to capture Bardufoss Airfield, destroy the NATO carrier, and neutralize Bodø Air Base.
  <p>You win the campaign if you seize Bardufoss, destroy the NATO carrier, and take Bodø out of action. You lose if NATO successfully defends Bardufoss or your carrier is sunk.</p>
  <p></p>
  <p><strong>Designer notes:</strong></p>
  <p>Do not attack the Murmansk FOB or the surrounding industrial facilities. These represent heavily defended OPFOR strategic assets and are outside your area of responsibility. You are, however, encouraged to intercept supply ships en route to Evenes. 
  As NATO, your only viable reinforcement route to Bardufoss is via airlift from Kallax.
  Kallax Air Base hosts several NATO squadrons, but most of them are not immediately combat‑ready. Preparing aircraft, crews, and logistics for forward deployment takes time. To simulate this, you may only use the F‑15C squadron, The E-3 and the C‑130s at the start of the campaign. 
  Each day (not turn!), you may transfer one additional squadron from Kallax to Bodø; once transferred, that squadron becomes available for operations. Disable the auto planner for that!</p>
  <p>As OPFOR, you must not attack Kallax Airfield or its associated assets. These represent European rear‑area infrastructure and are not part of your operational mandate. If the AI conducts airlifts, you are encouraged to intercept them.</p>
  <p>For the best experience, play with limited resources and give the AI increased starting funds and turn income. Consider imposing a time limit on your operations — political leaders, fearing nuclear escalation, may force a ceasefire before you achieve your objectives.
  I also recommend very little pilot reinforcements, since the initial plane count is balanced. Dont forget to tweak the settings so the AI mostly buys ground units.</p>
  <p>This is the arctic! The real world exercise happens in February - March, when the conditions and the environment are at their most challenging. Change the starting date to summer if you dislike missions in the dark.</p>
