name: Kola Peninsula / Lapland - Night Frost Crisis
theater: Kola
authors: Ghosti
recommended_player_faction: Finland 1960 (TF-51D/P-51D)
recommended_enemy_faction: Soviet Union 1960
recommended_start_date: 1958-08-29
description:
  <p>The Soviet Union has invaded Finland in 1958, following the Soviet leadership's displeasure at the newly elected Karl-August Fagerholm government of Finland.</p>
  <p>The northern part of Finland is occupied by the Soviet forces, but the Finnish Defence Forces have successfully pushed the invading Red Army back in the south.</p>
  <p>Finnish aircraft has been relocated and/or reactivated in Sweden and Norway. Both Sweden and Norway have decided to remain neutral in the conflict, but have granted </p>
  <p>the Finns access to their airbases as the offensive to retake northern Finland is about to commence. Norway has recently joined NATO, and has been accused by the </p>
  <p>Soviet Union as being established, by NATO, as strategic base of operations against the Soviet Union.</p>
miz: Kola Lapland - Shaddock in the Lake.miz
performance: 3
version: "10.7"

